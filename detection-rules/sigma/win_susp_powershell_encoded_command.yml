title: Suspicious PowerShell Encoded Command Execution
id: 8f3a7c2e-1d4b-4e89-9f2a-b5c8e7d3f6a1
status: stable
description: |
  Detects execution of PowerShell with the -EncodedCommand (or -enc / -e) parameter,
  which is commonly abused to obfuscate malicious commands and bypass string-based
  detections. This technique is heavily used by adversaries for initial code execution,
  defense evasion, and to load reflective payloads (e.g., PowerSploit, Cobalt Strike).
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/
  - https://www.splunk.com/en_us/blog/security/detecting-powershell-attack.html
author: Maher Mansour Mahyoub Ghaleb
date: 2025/11/15
modified: 2025/11/15
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
  - attack.t1027
  - attack.t1027.010
  - attack.t1027.014
logsource:
  product: windows
  category: process_creation
  service: null
detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - '-EncodedCommand'
      - '-enc '
      - '-EncodedComman '
      - ' -e '
      - '-encodedcommand'
  filter_optional_legitimate:
    CommandLine|contains:
      - 'SCCM'
      - 'Configuration Manager'
  condition: selection and not filter_optional_legitimate
fields:
  - User
  - Computer
  - Image
  - CommandLine
  - ParentImage
  - ParentCommandLine
falsepositives:
  - Legitimate administrative scripts using encoded commands (rare in most environments)
  - Some application deployment tools (e.g., SCCM)
  - Software installation frameworks
level: high
---
