title: Suspicious DNS Query Patterns (Possible C2 or Exfiltration)
id: 1c4e8a2f-9b6d-4f5a-8e3c-2d7b6a5f4e9c
status: stable
description: |
  Detects suspicious DNS query patterns that may indicate Command and Control
  (C2) communication or DNS-based data exfiltration. This includes:
  1. Unusually long DNS queries (potential DNS tunneling)
  2. Excessive NXDOMAIN responses (possible DGA - Domain Generation Algorithm)
  3. DNS queries to known malicious or newly registered domains
  4. High-entropy DNS labels (typical of encoded data)
references:
  - https://attack.mitre.org/techniques/T1071/004/
  - https://attack.mitre.org/techniques/T1071/
  - https://attack.mitre.org/techniques/T1568/002/
  - https://attack.mitre.org/techniques/T1048/003/
author: Maher Mansour Mahyoub Ghaleb
date: 2025/11/15
modified: 2025/11/15
tags:
  - attack.command_and_control
  - attack.t1071.004
  - attack.t1071
  - attack.t1568
  - attack.t1568.002
  - attack.exfiltration
  - attack.t1048
  - attack.t1048.003
logsource:
  product: zeek
  service: dns
detection:
  selection_long_query:
    QueryName|re: '^[a-zA-Z0-9\-]{50,}\.'
  selection_high_entropy:
    QueryName|re: '^[a-zA-Z0-9]{30,}\.'
  selection_dga_pattern:
    QueryName|re: '^[a-zA-Z]{15,}\.(com|net|org|info|top|xyz)$'
  selection_suspicious_tld:
    QueryName|endswith:
      - '.top'
      - '.xyz'
      - '.tk'
      - '.ml'
      - '.ga'
      - '.cf'
      - '.pw'
  selection_no_answer:
    QueryStatus: 'NXDOMAIN'
  filter_legitimate:
    QueryName|endswith:
      - '.microsoft.com'
      - '.windows.com'
      - '.office.com'
      - '.office365.com'
      - '.google.com'
      - '.googleapis.com'
      - '.cloudflare.com'
      - '.amazonaws.com'
  condition: (selection_long_query or selection_high_entropy or selection_dga_pattern or selection_suspicious_tld) and not filter_legitimate
fields:
  - SourceIP
  - QueryName
  - QueryType
  - QueryStatus
  - QueryLength
  - Timestamp
falsepositives:
  - Legitimate CDN or DNS load balancing with long names
  - Email security gateways with encoded URLs
  - Some cloud service DNS patterns
level: high
---
